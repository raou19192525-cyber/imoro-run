<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>イモロー 3D Racing - Fixed Camera</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Arial Black', sans-serif; user-select: none; }
        #loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #2a1a4a, #000); color: #ffff00; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .spinner { width: 60px; height: 60px; border: 8px solid #333; border-top: 8px solid #ffff00; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 500; color: #fff; }
        #nick-input { padding: 12px; font-size: 20px; border-radius: 8px; border: 3px solid #ffff00; margin: 20px; text-align: center; background: #222; color: #fff; }
        .start-btn { 
            width: 220px; height: 80px; font-size: 40px; 
            background: #ffff00; color: #000; 
            border: 4px solid #ffaa00; border-radius: 15px; 
            font-weight: bold; cursor: pointer; 
            box-shadow: 0 8px 0 #ccaa00, 0 15px 20px rgba(0,0,0,0.5); 
            transition: all 0.1s;
        }
        .start-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #ccaa00; }

        #hud { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; border-left: 5px solid #ffff00; pointer-events: none; z-index: 10; }
        #timer { font-size: 24px; font-weight: bold; font-family: 'Courier New', Courier, monospace; }
        
        #ranking-board { position: absolute; top: 10px; right: 10px; color: #fff; background: linear-gradient(180deg, rgba(50,50,50,0.9), rgba(0,0,0,0.9)); padding: 12px; border-radius: 12px; border: 2px solid #ffff00; box-shadow: 0 0 15px #ffff00; font-size: 13px; min-width: 180px; z-index: 10; }
        .ranking-item { margin: 8px 0; padding: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; }
        .rank-1 { color: #ffff00; font-weight: bold; font-size: 1.1em; text-shadow: 0 0 8px #ffaa00; }
        
        #controls-container { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; z-index: 100; }
        .ctrl-btn { width: 100px; height: 100px; background: rgba(255,255,255,0.1); border: 4px solid #fff; border-radius: 20px; color: white; font-size: 60px; font-weight: bold; display: flex; justify-content: center; align-items: center; touch-action: none; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .ctrl-btn:active { background: rgba(255,255,0,0.4); border-color: #ffff00; }

        #msg-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 200; }
        #msg-text { color: #fff; font-size: 60px; margin-bottom: 10px; text-shadow: 0 0 20px #00ff00; }
        #retry-btn { padding: 15px 50px; font-size: 24px; cursor: pointer; background: #ffff00; border: none; border-radius: 40px; font-weight: bold; color: #000; box-shadow: 0 0 20px #ffff00; }
        #boost-indicator { color: #ffff00; font-weight: bold; display: none; position: absolute; top: 40%; width: 100%; text-align: center; font-size: 40px; text-shadow: 0 0 20px #ff0000; z-index: 5; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div style="font-size: 20px; letter-spacing: 5px;">LOADING...</div>
    </div>

    <div id="start-screen">
        <h1 style="color: #ffff00; text-shadow: 0 0 15px #f00; font-size: 45px; margin-bottom: 10px;">IMORO RACING</h1>
        <div id="nick-container">
            <p style="margin: 5px; color: #aaa;">ENTER NICKNAME</p>
            <input type="text" id="nick-input" maxlength="8" placeholder="プレイヤー名">
        </div>
        <button class="start-btn" id="start-game-btn">GO!</button>
    </div>

    <div id="hud">
        <div id="timer">00:00.00</div>
        <div id="speed-status" style="font-size: 12px; color: #ffff00;">READY</div>
    </div>

    <div id="ranking-board">
        <div style="text-align: center; font-weight: bold; margin-bottom: 10px; color: #ffff00; border-bottom: 2px solid #ffff00;">🏆 WORLD RANKING</div>
        <div id="ranking-list"></div>
    </div>

    <div id="controls-container">
        <div id="btn-left" class="ctrl-btn">←</div>
        <div id="btn-right" class="ctrl-btn">→</div>
    </div>

    <div id="boost-indicator">⚡ NITRO BOOST ⚡</div>

    <div id="msg-screen">
        <div id="msg-text">GOAL!!</div>
        <div id="result-time" style="color: #ffff00; font-size: 40px; margin-bottom: 30px;"></div>
        <button id="retry-btn" onclick="location.reload()">RETRY</button>
    </div>

    <audio id="bgm" src="魔王魂 BGM ネオロック83.mp3" loop></audio>
    <audio id="se-hit" src="靴でブレーキ.mp3"></audio>
    <audio id="se-goal" src="シャキーン2.mp3"></audio>
    <audio id="se-over" src="チーン1.mp3"></audio>
    <audio id="se-boost" src="超高速ダッシュ.mp3"></audio>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

        let scene, camera, renderer, clock;
        let modelMoving, modelIdle, mixerMoving, mixerIdle;
        let currentSpeed = 0, isSpinning = false, isBoosting = false;
        let startTime = null, isGameOver = false, isFinished = false, isPlaying = false;
        let isLoading = true;
        const keys = { w: false, a: false, d: false };

        let coneMesh, coneData = [], boostPads = [], fireworks = [];
        const CONE_COUNT = 85, BOOST_COUNT = 25;
        const BASE_SPEED = 95.0, TOP_SPEED = 160.0, ROAD_WIDTH = 22, GOAL_Z = -3500;

        const bgm = document.getElementById('bgm');
        const seHit = document.getElementById('se-hit');
        const seGoal = document.getElementById('se-goal');
        const seOver = document.getElementById('se-over');
        const seBoost = document.getElementById('se-boost');

        const unlockAudio = () => {
            if (THREE.AudioContext.getContext().state === 'suspended') {
                THREE.AudioContext.getContext().resume();
            }
        };

        const initStartScreen = () => {
            const screen = document.getElementById('start-screen');
            const input = document.getElementById('nick-input');
            const savedNick = localStorage.getItem('imoro_player_name');
            
            if(savedNick) {
                document.getElementById('nick-container').style.display = 'none';
                input.value = savedNick;
            }

            document.getElementById('start-game-btn').addEventListener('click', () => {
                const name = input.value.trim() || "イモロー";
                localStorage.setItem('imoro_player_name', name);
                screen.style.display = 'none';
                
                unlockAudio();
                isPlaying = true;
                startTime = Date.now();
                bgm.play().catch(() => {});
                keys.w = true; 
            });
        };

        const leftBtn = document.getElementById('btn-left');
        const rightBtn = document.getElementById('btn-right');

        const setupPointerEvents = (el, key) => {
            el.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('pointerup', () => { keys[key] = false; });
            el.addEventListener('pointerleave', () => { keys[key] = false; });
        };

        setupPointerEvents(leftBtn, 'a');
        setupPointerEvents(rightBtn, 'd');

        init();
        animate();
        updateRankingDisplay();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050010);
            scene.fog = new THREE.Fog(0x050010, 150, 700);
            clock = new THREE.Clock();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.0));
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            scene.add(sun);

            const track = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, 8500), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            track.rotation.x = -Math.PI / 2;
            track.position.z = -3000;
            track.receiveShadow = true;
            scene.add(track);

            createEnvironment();
            const loader = new FBXLoader();
            const setupModel = (obj) => {
                obj.scale.set(0.015, 0.015, 0.015);
                obj.rotation.y = Math.PI;
                obj.traverse(c => { if (c.isMesh) { c.castShadow = true; if(c.material) (Array.isArray(c.material) ? c.material : [c.material]).forEach(m => m.side = THREE.DoubleSide); } });
                const m = new THREE.AnimationMixer(obj);
                if (obj.animations.length > 0) obj.animations.forEach(clip => m.clipAction(clip).play());
                return m;
            };

            loader.load('新イモローアニメーション（歩）.fbx', (obj) => { modelMoving = obj; mixerMoving = setupModel(obj); modelMoving.visible = false; scene.add(modelMoving); });
            loader.load('新イモロー(止).fbx', (obj) => { modelIdle = obj; mixerIdle = setupModel(obj); scene.add(modelIdle); });

            createGimmicks(loader);
            createGoalObjects();

            window.addEventListener('keydown', e => { 
                if(!isPlaying) return; 
                if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
                if(e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
            });
            window.addEventListener('keyup', e => {
                if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
                if(e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
            });
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

            setTimeout(() => { 
                isLoading = false; 
                document.getElementById('loading-screen').style.display = 'none'; 
                document.getElementById('start-screen').style.display = 'flex';
                initStartScreen();
            }, 2000);
        }

        function createEnvironment() {
            const standGeo = new THREE.BoxGeometry(8, 6, 80);
            for(let z = 0; z > -4500; z -= 150) {
                ['L', 'R'].forEach(side => {
                    const color = new THREE.Color().setHSL(Math.random(), 0.8, 0.5);
                    const stand = new THREE.Mesh(standGeo, new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.2 }));
                    stand.position.set(side === 'L' ? -25 : 25, 3, z);
                    scene.add(stand);
                });
            }
        }

        function createGoalObjects() {
            const box = 32;
            const checkerCanvas = document.createElement('canvas');
            checkerCanvas.width = 512; checkerCanvas.height = 128;
            const ctx = checkerCanvas.getContext('2d');
            for(let y=0; y<checkerCanvas.height; y+=box) {
                for(let x=0; x<checkerCanvas.width; x+=box) {
                    ctx.fillStyle = (Math.floor(x/box) + Math.floor(y/box)) % 2 === 0 ? '#ffffff' : '#000000';
                    ctx.fillRect(x, y, box, box);
                }
            }
            const tapeTex = new THREE.CanvasTexture(checkerCanvas);
            tapeTex.wrapS = THREE.RepeatWrapping;
            tapeTex.repeat.set(2, 1);
            
            const tapeMesh = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, 4), new THREE.MeshStandardMaterial({ map: tapeTex, side: THREE.DoubleSide }));
            tapeMesh.rotation.x = -Math.PI / 2;
            tapeMesh.position.set(0, 0.1, GOAL_Z);
            scene.add(tapeMesh);

            const wallCanvas = document.createElement('canvas');
            wallCanvas.width = 512; wallCanvas.height = 128;
            const wctx = wallCanvas.getContext('2d');
            wctx.font = 'Bold 80px Arial'; wctx.fillStyle = '#00ff00'; wctx.textAlign = 'center'; wctx.textBaseline = 'middle';
            wctx.fillText('GOAL!!', 256, 64);
            const goalWall = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, 5), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(wallCanvas), transparent: true }));
            goalWall.position.set(0, 8, GOAL_Z); goalWall.name = "goal_sensor";
            scene.add(goalWall);
        }

        function createGimmicks(loader) {
            const boostGeo = new THREE.PlaneGeometry(6, 4);
            const boostMat = new THREE.MeshBasicMaterial({ color: 0xffff00, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
            for(let i=0; i<BOOST_COUNT; i++) {
                const px = (Math.random() - 0.5) * (ROAD_WIDTH - 6);
                const pz = -Math.random()*3300 - 100;
                const pad = new THREE.Mesh(boostGeo, boostMat);
                pad.rotation.x = -Math.PI/2; pad.position.set(px, 0.15, pz);
                pad.name = "boost_pad"; scene.add(pad); boostPads.push({ x: px, z: pz });
            }
            loader.load('コーン.fbx', (baseCone) => {
                let sourceGeometry, sourceMaterial;
                baseCone.traverse(c => { if (c.isMesh) { sourceGeometry = c.geometry; sourceMaterial = c.material; } });
                coneMesh = new THREE.InstancedMesh(sourceGeometry, sourceMaterial, CONE_COUNT);
                const dummy = new THREE.Object3D();
                for(let i=0; i<CONE_COUNT; i++) {
                    const cx = (Math.random() - 0.5) * (ROAD_WIDTH - 4);
                    const cz = -Math.random()*3300 - 100;
                    dummy.position.set(cx, 0.2, cz); dummy.scale.set(0.015, 0.015, 0.015); dummy.updateMatrix();
                    coneMesh.setMatrixAt(i, dummy.matrix); coneData.push({ x: cx, z: cz });
                }
                scene.add(coneMesh);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if(!isGameOver && !isFinished && !isLoading && isPlaying) { 
                updatePhysics(delta); 
                updateTimer(); 
                checkCourseOut(); 
            }
            updateModels(delta); updateFireworks(); syncCamera(); renderer.render(scene, camera);
        }

        function updatePhysics(delta) {
            const moveStep = (isBoosting ? TOP_SPEED : BASE_SPEED) * delta;
            const sideStep = 28.0 * delta;
            if (isSpinning) currentSpeed = 12.0 * delta;
            else currentSpeed = moveStep;

            if (modelIdle && modelMoving) {
                const active = modelMoving.visible ? modelMoving : modelIdle;
                active.position.z -= currentSpeed;
                if (keys.a) active.position.x -= sideStep;
                if (keys.d) active.position.x += sideStep;

                if(isSpinning) {
                    active.rotation.y += 12.0 * delta;
                } else {
                    let targetRotation = Math.PI; 
                    if (keys.a) targetRotation = Math.PI + 0.5;
                    if (keys.d) targetRotation = Math.PI - 0.5;
                    active.rotation.y += (targetRotation - active.rotation.y) * 0.2;
                }
                checkCollisions(active.position);
                modelMoving.position.copy(active.position); 
                modelIdle.position.copy(active.position);
                modelMoving.rotation.y = modelIdle.rotation.y = active.rotation.y;
            }
            document.getElementById('speed-status').innerText = isBoosting ? "⚡ SUPER BOOST!! ⚡" : "RUNNING";
        }

        function checkCollisions(pos) {
            for(let i=0; i < coneData.length; i++) {
                if(Math.sqrt((coneData[i].x - pos.x)**2 + (coneData[i].z - pos.z)**2) < 2.5) {
                    if(!isSpinning) { isSpinning = true; seHit.currentTime = 0; seHit.play(); setTimeout(() => isSpinning = false, 800); }
                    break;
                }
            }
            scene.children.forEach(obj => {
                if(obj.name === "boost_pad" && Math.sqrt((obj.position.x-pos.x)**2 + (obj.position.z-pos.z)**2) < 3.5) {
                    if(!isBoosting) {
                        isBoosting = true; seBoost.currentTime = 0; seBoost.play();
                        document.getElementById('boost-indicator').style.display = 'block';
                        setTimeout(() => { isBoosting = false; document.getElementById('boost-indicator').style.display = 'none'; }, 1000);
                    }
                }
                if(obj.name === "goal_sensor" && pos.z < obj.position.z) {
                    isFinished = true; bgm.pause(); seGoal.play(); 
                    const finalTime = (Date.now() - startTime) / 1000;
                    saveTime(finalTime); endGame(finalTime);
                }
            });
        }

        /* カメラの横軸を0に固定する設定 */
        function syncCamera() {
            if (!modelIdle) return;
            const target = modelIdle.position;
            // X座標を0に固定（コースの中央）
            camera.position.set(0, target.y + 7.5, target.z + 13);
            // 視点は常に中央かつイモローの少し先を見る
            camera.lookAt(0, target.y + 1.5, target.z - 35);
        }

        function checkCourseOut() {
            if (modelIdle && Math.abs(modelIdle.position.x) > (ROAD_WIDTH / 2 + 1)) {
                bgm.pause(); seOver.play(); endGame(null, "COURSE OUT");
            }
        }

        function updateTimer() {
            if(!startTime) return;
            const diff = Date.now() - startTime;
            const m = Math.floor(diff / 60000).toString().padStart(2, '0');
            const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            const ms = Math.floor((diff % 1000) / 10).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}.${ms}`;
        }

        function endGame(time, customText) {
            isGameOver = true;
            if(customText) {
                document.getElementById('msg-text').innerText = customText;
                document.getElementById('msg-text').style.textShadow = "0 0 20px #ff0000";
            }
            document.getElementById('result-time').innerText = time ? "TIME: " + time.toFixed(2) + "s" : "RETIRED";
            document.getElementById('msg-screen').style.display = 'flex';
        }

        function updateModels(delta) {
            const running = currentSpeed > 0;
            if (modelMoving && modelIdle) {
                modelMoving.visible = running; modelIdle.visible = !running;
                if (running && mixerMoving) mixerMoving.update(delta * (isBoosting ? 5.0 : 3.2));
                if (!running && mixerIdle) mixerIdle.update(delta);
            }
        }

        function saveTime(time) {
            const name = localStorage.getItem('imoro_player_name') || "ななし";
            let records = JSON.parse(localStorage.getItem('imoro_global_rank_v3') || '[]');
            records.push({ name: name, time: time });
            records.sort((a, b) => a.time - b.time);
            localStorage.setItem('imoro_global_rank_v3', JSON.stringify(records.slice(0, 5)));
            updateRankingDisplay();
        }

        function updateRankingDisplay() {
            const records = JSON.parse(localStorage.getItem('imoro_global_rank_v3') || '[]');
            const listEl = document.getElementById('ranking-list');
            if(records.length === 0) {
                listEl.innerHTML = "<div style='text-align:center; color:#666;'>No Data</div>";
                return;
            }
            listEl.innerHTML = records.map((r, i) => `
                <div class="ranking-item ${i===0?'rank-1':''}">
                    <span>${i+1}. ${r.name}</span>
                    <span>${r.time.toFixed(2)}s</span>
                </div>
            `).join('');
        }

        function updateFireworks() {
            if(isFinished && Math.random() < 0.12) launchFirework();
            for(let i = fireworks.length - 1; i >= 0; i--) {
                const f = fireworks[i];
                const pos = f.mesh.geometry.attributes.position.array;
                for(let j=0; j<50; j++) {
                    pos[j*3] += f.vel[j*3]; pos[j*3+1] += f.vel[j*3+1]; pos[j*3+2] += f.vel[j*3+2];
                    f.vel[j*3+1] -= 0.025;
                }
                f.mesh.geometry.attributes.position.needsUpdate = true;
                f.life -= 0.012; f.mesh.material.opacity = f.life;
                if(f.life <= 0) { scene.remove(f.mesh); fireworks.splice(i, 1); }
            }
        }

        function launchFirework() {
            const geo = new THREE.BufferGeometry();
            const count = 50, pos = new Float32Array(count * 3), vel = new Float32Array(count * 3);
            const cx = (Math.random() - 0.5) * 80, cy = 25 + Math.random() * 20, cz = (modelIdle ? modelIdle.position.z : 0) - 60;
            for(let i=0; i<count; i++) {
                pos[i*3] = cx; pos[i*3+1] = cy; pos[i*3+2] = cz;
                const speed = 1.5 + Math.random();
                const theta = Math.random() * Math.PI * 2, phi = Math.random() * Math.PI;
                vel[i*3] = speed * Math.sin(phi) * Math.cos(theta);
                vel[i*3+1] = speed * Math.sin(phi) * Math.sin(theta);
                vel[i*3+2] = speed * Math.cos(phi);
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const points = new THREE.Points(geo, new THREE.PointsMaterial({ color: new THREE.Color().setHSL(Math.random(), 1, 0.6), size: 1.8, transparent: true }));
            scene.add(points); fireworks.push({ mesh: points, vel: vel, life: 1.0 });
        }
    </script>
</body>
</html>
